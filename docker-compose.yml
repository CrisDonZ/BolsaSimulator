# Infraestructura local de BolsaSim.
#   docker compose up -d     -> levanta Kafka, crea los tópicos y abre Kafka UI
#   docker compose down      -> lo apaga (los mensajes se borran)
services:

  # Kafka en modo KRaft: un solo nodo que hace de broker y de controlador, sin ZooKeeper.
  # Configuración basada en el ejemplo oficial de Apache Kafka (docker/examples, single-node/plaintext).
  kafka:
    image: apache/kafka:4.2.1
    hostname: kafka
    container_name: bolsasim-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dos "puertas" de entrada:
      #   PLAINTEXT_HOST -> localhost:9092, para los servicios que corres en tu computador
      #   PLAINTEXT      -> kafka:19092, para otros contenedores (Kafka UI, el creador de tópicos)
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # Con un solo nodo, todo se replica 1 vez
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Los tópicos se crean a propósito (servicio kafka-init), nunca por accidente
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Crea los tópicos con 6 particiones y termina.
  kafka-init:
    image: apache/kafka:4.2.1
    container_name: bolsasim-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
          --topic orders.commands --partitions 6 --replication-factor 1
        echo "Tópicos listos:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: "no"

  # Interfaz web para ver tópicos, particiones y mensajes: http://localhost:8090
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: bolsasim-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bolsasim
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
