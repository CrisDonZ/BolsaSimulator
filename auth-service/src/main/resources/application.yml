server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    # Base "auth" del PostgreSQL de docker-compose.yml (puerto 5433 en tu computador).
    # Los valores por defecto sirven solo en desarrollo; en otro entorno van en variables de entorno.
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/auth}
    username: ${AUTH_DB_USUARIO:bolsasim}
    password: ${AUTH_DB_CLAVE:bolsasim}
  kafka:
    # Dirección de Kafka vista desde tu computador (ver docker-compose.yml)
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Convierte el record UsuarioRegistrado a JSON con Jackson 3
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Kafka confirma el mensaje solo cuando quedó guardado de forma segura
      acks: all
  jpa:
    # Las tablas las crea Flyway; Hibernate solo comprueba que coincidan con las entidades
    hibernate:
      ddl-auto: validate
    # Cada petición abre y cierra su propia conexión, sin consultas escondidas en la vista
    open-in-view: false

bolsasim:
  jwt:
    # Va en el campo "iss" del token: el gateway comprobará que lo emitió auth-service
    emisor: bolsasim-auth
    duracion-acceso: 15m
    duracion-refresco: 7d
    # Clave privada RSA en formato PEM (PKCS#8), nunca en el repositorio (RNF-26).
    # Si está vacía, auth-service genera un par temporal al arrancar: sirve en desarrollo y en CI,
    # pero al reiniciar los tokens anteriores dejan de valer.
    clave-privada: ${AUTH_JWT_CLAVE_PRIVADA:}
  admin:
    # Primer administrador (rol ADMIN), que gestiona los instrumentos. Se crea al arrancar solo si el correo
    # y la contraseña tienen valor y nadie usa ese correo; una cuenta que ya existe nunca se asciende.
    # La contraseña nunca va en el repositorio (RNF-26).
    correo: ${BOLSASIM_ADMIN_CORREO:}
    contrasena: ${BOLSASIM_ADMIN_CONTRASENA:}
    alias: ${BOLSASIM_ADMIN_ALIAS:admin}
  creador-mercado:
    # Bot creador de mercado (rol BOT), que recibe en portfolio-service las acciones emitidas de cada instrumento
    # (RF-59). Como el ADMIN: se crea al arrancar solo si el correo y la contraseña tienen valor, y una cuenta que
    # ya existe y no es BOT nunca se asciende. La contraseña nunca va en el repositorio (RNF-26).
    correo: ${BOLSASIM_CREADOR_MERCADO_CORREO:}
    contrasena: ${BOLSASIM_CREADOR_MERCADO_CONTRASENA:}
    alias: ${BOLSASIM_CREADOR_MERCADO_ALIAS:creador_mercado}
