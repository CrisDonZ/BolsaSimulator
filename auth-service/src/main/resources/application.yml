server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    # Base "auth" del PostgreSQL de docker-compose.yml (puerto 5433 en tu computador).
    # Los valores por defecto sirven solo en desarrollo; en otro entorno van en variables de entorno.
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/auth}
    username: ${AUTH_DB_USUARIO:bolsasim}
    password: ${AUTH_DB_CLAVE:bolsasim}
  kafka:
    # Dirección de Kafka vista desde tu computador (ver docker-compose.yml)
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Convierte el record UsuarioRegistrado a JSON con Jackson 3
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Kafka confirma el mensaje solo cuando quedó guardado de forma segura
      acks: all
  jpa:
    # Las tablas las crea Flyway; Hibernate solo comprueba que coincidan con las entidades
    hibernate:
      ddl-auto: validate
    # Cada petición abre y cierra su propia conexión, sin consultas escondidas en la vista
    open-in-view: false
