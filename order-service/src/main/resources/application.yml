server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    # Base "ordenes" del PostgreSQL de docker-compose.yml (puerto 5433 en tu computador).
    # Los valores por defecto sirven solo en desarrollo; en otro entorno van en variables de entorno.
    url: ${ORDENES_DB_URL:jdbc:postgresql://localhost:5433/ordenes}
    username: ${ORDENES_DB_USUARIO:bolsasim}
    password: ${ORDENES_DB_CLAVE:bolsasim}
  jpa:
    # Las tablas las crea Flyway; Hibernate solo comprueba que coincidan con las entidades
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    # Dirección de Kafka vista desde tu computador (ver docker-compose.yml)
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Convierte el record ComandoOrden a JSON con Jackson 3
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Kafka confirma el mensaje solo cuando quedó guardado de forma segura
      acks: all
    consumer:
      # Lee users.registered para saber qué usuarios existen
      group-id: order-service
      # Si el grupo es nuevo, lee el tópico desde el principio: así conoce a los usuarios ya registrados
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer evita que un mensaje mal formado bloquee al consumidor
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # Solo se aceptan clases de este paquete al convertir el JSON (seguridad)
        "[spring.json.trusted.packages]": co.bolsasim.eventos
