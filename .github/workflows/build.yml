# Compila todo, corre las pruebas y hace una prueba de punta a punta con Kafka
# en cada push y pull request a main. Si algo falla, GitHub lo marca en rojo.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compilar + pruebas + empaquetar, igual que mvn clean install pero sin copiar a ~/.m2.
      # Se usa el wrapper para compilar con la misma versión de Maven que en tu máquina.
      - name: Compilar y probar
        run: ./mvnw -B verify

      # Levanta Kafka con docker-compose.yml, arranca los dos servicios y cruza una orden
      - name: Prueba de integración
        run: bash scripts/prueba-integracion.sh

      - name: Logs de los servicios
        if: failure()
        run: tail -n 100 target/integracion/*.log || true

  # La aplicación web: corre en paralelo con el backend, y los dos tienen que quedar en verde (RNF-39)
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci instala exactamente lo que dice package-lock.json, sin actualizar nada
      - name: Instalar dependencias
        run: npm ci

      # Falla si una dependencia tiene una vulnerabilidad alta o crítica conocida
      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build
