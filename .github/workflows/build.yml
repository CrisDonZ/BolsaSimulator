# Compila todo, corre las pruebas y hace una prueba de punta a punta con Kafka
# en cada push y pull request a main. Si algo falla, GitHub lo marca en rojo.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = compilar + pruebas + empaquetar, igual que mvn clean install pero sin copiar a ~/.m2.
      # Se usa el wrapper para compilar con la misma versión de Maven que en tu máquina.
      - name: Compilar y probar
        run: ./mvnw -B verify

      # Levanta Kafka con docker-compose.yml, arranca los dos servicios y cruza una orden
      - name: Prueba de integración
        run: bash scripts/prueba-integracion.sh

      - name: Logs de los servicios
        if: failure()
        run: tail -n 100 target/integracion/*.log || true
